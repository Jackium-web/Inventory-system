<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <style>

        @page {
            size: A4;
            margin: 10mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;
        }

        .barcode-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 5mm;
        }

        .barcode-label {

            height: 38mm;

            border: 1px solid #000;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 3mm;

            page-break-inside: avoid;
            break-inside: avoid;
        }

        .barcode-image {

            width: 100%;

            max-width: 55mm;

            height: auto;

            display: block;
        }

        .barcode-number {

            margin-top: 2mm;

            font-size: 9pt;

            font-weight: bold;

            letter-spacing: 0.5px;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="barcode-grid">

    {% for barcode in barcodes %}

        <div class="barcode-label">

            <img
                class="barcode-image"
                src="data:image/png;base64,{{ barcode.image }}"
                alt="{{ barcode.number }}"
            >

            <div class="barcode-number">
                {{ barcode.number }}
            </div>

        </div>

    {% endfor %}

</div>

</body>

</html>
